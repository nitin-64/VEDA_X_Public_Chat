services:
  - type: web
    name: veda-x-public-chat
    env: python
    pythonVersion: "3.11"
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: PORT
        value: "10000"
      - key: VEDA_PRIVATE_PROMPT
        sync: false
      - key: GEMINI_API_KEY
        sync: false
